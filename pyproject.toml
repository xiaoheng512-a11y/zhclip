[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zhclip"
version = "0.1.0"
description = "纯 CPU 中文视频转文字工具"
requires-python = ">=3.9"
dependencies = [
    "sherpa-onnx>=1.10",
    "yt-dlp>=2024.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
    "jinja2>=3.0",
]

[project.scripts]
zhclip = "zhclip.cli:main"

[tool.setuptools.packages.find]
include = ["zhclip*"]